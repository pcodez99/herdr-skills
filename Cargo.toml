[package]
name = "herdr-plans"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
